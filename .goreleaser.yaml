project_name: aflock-tui

builds:
  - ldflags:
      - "-s -w"
      - "-X main.version={{.Version}}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

# Cosign keyless signing (uses GitHub OIDC — no keys to manage)
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: all

# SBOM generation with syft
sboms:
  - id: archive
    cmd: syft
    artifacts: archive
    args: ["${artifact}", "--output", "spdx-json=${document}"]
  - id: source
    cmd: syft
    artifacts: source
    args: ["${artifact}", "--output", "spdx-json=${document}"]

changelog:
  use: github
  groups:
    - title: Features
      regexp: "^.*feat.*:+.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix.*:+.*$"
      order: 1
    - title: Others
      order: 999

release:
  prerelease: auto
  header: |
    ## aflock-tui {{ .Tag }}

    Terminal UI for inspecting aflock sessions, replaying Claude Code sessions against policies, and live-watching agent sessions.

    All archives and checksums are signed with [Sigstore cosign](https://github.com/sigstore/cosign) (keyless, GitHub OIDC).
    SBOMs are generated with [syft](https://github.com/anchore/syft) in SPDX format.

    ### Verify a release

    ```bash
    cosign verify-blob \
      --bundle aflock-tui_{{ .Version }}_darwin_arm64.tar.gz.sigstore.json \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --certificate-identity-regexp "github.com/manzil-infinity180/aflock-tui" \
      aflock-tui_{{ .Version }}_darwin_arm64.tar.gz
    ```

    ### Install

    ```bash
    go install github.com/manzil-infinity180/aflock-tui@{{ .Tag }}
    ```

    Or download a binary below for your platform.

    ### Usage

    ```bash
    aflock-tui                                    # browse sessions
    aflock-tui replay session.jsonl policy.aflock  # replay validator
    aflock-tui watch --live policy.aflock          # live watch
    ```

    Requires [aflock](https://github.com/aflock-ai/aflock) binary for replay/watch modes.
